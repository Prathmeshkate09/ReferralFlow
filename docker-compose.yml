version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: referralflow-db
    environment:
      POSTGRES_USER: referral_user
      POSTGRES_PASSWORD: referral_password
      POSTGRES_DB: referralflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seeds/001_seed_jobs.sql:/docker-entrypoint-initdb.d/02_seeds.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: referralflow-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://referral_user:referral_password@db:5432/referralflow?sslmode=disable
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: referralflow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
